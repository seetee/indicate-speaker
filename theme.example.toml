# theme.toml: one per game. Put it next to the .kdenlive project or in any
# folder above it (e.g. the season folder), or pass --theme.
# Paths are relative to this file.

sound    = "../_assets/namecard/60003__qubodup__loud-swosh-16.flac"  # plays on every view switch
# backdrop = "backdrop.png"     # behind the avatars; omitted = dark translucent panel
# font     = "../_assets/Monocraft.otf"   # omitted = system sans-serif bold
# position = "top-left"         # a corner: top-left | top-right | bottom-left | bottom-right
#                               # or an edge centre: top | bottom | left | right
# offset   = [0, 0]             # px nudge from there: [right, down]; negative = left/up
# orientation = "horizontal"    # horizontal: a row, name under the viewed avatar;
#                               # vertical: a column along the edge, name beside it
# margin   = 24                 # px from the frame edges
# avatar_size = 48              # px; the viewed player's avatar is drawn 25% larger
# sound_offset = 0.0            # s; move every transition sound later (+) or earlier (-)
# codec    = "ffv1"             # ffv1: free and open, lossless (default)
#                               # qtrle: QuickTime Animation, lossless, ~6x smaller files

# 1-8 players. `voice_track` is the Kdenlive audio track with their voice
# (default: the player's name). Video clips from the same file(s) as that
# track count as the player's view, whatever track they sit on; set `source`
# (a file-name pattern) only when their view comes from another file.
[[player]]
name   = "Henrik"
colour = "#e0a030"
avatar = "avatars/henrik.png"   # a Minecraft head, an icon, anything square

[[player]]
name   = "Joel"
colour = "#2ea043"
avatar = "avatars/joel.png"

[[player]]
name   = "Kenneth"
colour = "#c83c5a"
avatar = "avatars/kenneth.png"

[[player]]
name   = "Robin"
colour = "#3884f4"
avatar = "avatars/robin.png"
# voice_track = "Robin mic"     # when the audio track has another name
# source = "*_r.mkv"            # when the view is recorded in another file (or a list:
#                               # ["*_r.mkv", "*_r2.mkv"])
